name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # GitHub repository isimleri Docker için her zaman küçük harf olmalıdır.
  IMAGE_BACKEND: ${{ github.repository }}/backend
  IMAGE_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # ── Build & Push Docker Images ─────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint & Test Backend
        working-directory: ./backend
        run: |
          npm ci
          npm test --if-present

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_DEFAULT_LOCALE=tr

  # ── Deploy to VPS ──────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            
            # Doğru proje dizinine geçiş
            cd /KernelasoftProjects/finstock

            # GHCR'ye giriş yap (Private repolardan imaj çekebilmek için)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Yeni imajları çek
            docker-compose pull

            # Servisleri yeniden başlat (Sadece değişenleri günceller)
            docker-compose up -d --no-deps backend frontend nginx

            # Servislerin ayağa kalkması için bekleme ve sağlık kontrolü (Port 8182)
            echo "Servislerin ayağa kalkması bekleniyor..."
            sleep 10
            curl -sf http://localhost:8182/health || (echo "Health check failed!" && exit 1)

            # Kullanılmayan eski Docker imajlarını temizle (Disk tasarrufu)
            docker image prune -a -f --filter "until=24h"

            echo "✅ Deployed: ${{ github.sha }}"