services:
  backend:
    build: ./backend
    container_name: finstock-backend
    restart: always
    env_file: .env
    networks:
      - finstock_net
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_DEFAULT_LOCALE: tr
    container_name: finstock-frontend
    restart: always
    networks:
      - finstock_net

  nginx:
    image: nginx:alpine
    container_name: finstock-nginx
    restart: always
    ports:
      - "8082:80"
    volumes:
      - ./nginx/finstock.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - finstock_net
      - backend

networks:
  finstock_net:
    driver: bridge
  backend:
    external: true
    name: kernelasoft_backend