services:
  backend:
    image: ghcr.io/yusufpalak/finstock/backend:latest
    container_name: finstock-backend
    restart: always
    env_file: .env.prod
    networks:
      - finstock_net
      - backend

  frontend:
    image: ghcr.io/yusufpalak/finstock/frontend:latest
    container_name: finstock-frontend
    restart: always
    networks:
      - finstock_net

  nginx:
    image: nginx:alpine
    container_name: finstock-nginx
    restart: always
    ports:
      - "8182:80"
    volumes:
      - ./nginx/finstock.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - finstock_net
      - backend

networks:
  finstock_net:
    driver: bridge
  backend:
    external: true
    name: kernelasoft_backend