events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain application/javascript application/json text/css text/xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    upstream backend  { server backend:3000;  keepalive 32; }
    upstream frontend { server frontend:80; }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # Static assets — handled before locale-based redirects
        location ~* ^/(assets|favicon\.ico|robots\.txt) {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            access_log off;
            expires max;
        }

        # Root → default locale
        location = / {
            return 302 /tr;
        }

        # Auth API
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # General API
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            proxy_pass http://backend;
        }

        # Frontend SPA — language prefix routing
        location ~ ^/(tr|en)(/.*)?$ {
            proxy_pass             http://frontend;
            proxy_set_header       Host $host;
            proxy_intercept_errors on;
            error_page 404 = @spa_fallback;
        }

        # SPA fallback
        location @spa_fallback {
            proxy_pass http://frontend;
        }

        # Catch-all → /tr (if not an asset and not a locale path)
        location / {
            return 302 /tr;
        }
    }
}
