events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain application/javascript application/json text/css text/xml;

    # --- GERÇEK IP AYARLARI ---
    # Ana Nginx'ten (Reverse Proxy) gelen gerçek kullanıcı IP'sini almak için
    set_real_ip_from 10.0.0.0/8;      # Docker ağları
    set_real_ip_from 172.16.0.0/12;   # Docker ağları
    set_real_ip_from 192.168.0.0/16;  # Yerel ağ
    set_real_ip_from 127.0.0.1;       # Localhost
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # --------------------------

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    upstream backend  { server backend:3000;  keepalive 32; }
    upstream frontend { server frontend:80; }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # Static assets — handled before locale-based redirects
        # Ekstra uzantılar eklendi (png, jpg, json, xml vb.)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json|xml|txt)$ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            access_log off;
            expires max;
        }

        # Root → default locale
        location = / {
            return 302 /tr;
        }

        # Auth API
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # General API
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            proxy_pass http://backend;
        }

        # Frontend SPA — language prefix routing
        location ~ ^/(tr|en)(/.*)?$ {
            proxy_pass             http://frontend;
            proxy_set_header       Host $host;
            proxy_intercept_errors on;
            error_page 404 = @spa_fallback;
        }

        # SPA fallback
        location @spa_fallback {
            proxy_pass http://frontend;
        }

        # Catch-all → /tr (if not matched by anything else above)
        location / {
            return 302 /tr;
        }
    }
}